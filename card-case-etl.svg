<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" role="img" aria-label="Automated Data Reporting">
<style>
.m{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace}
.s{font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1020"/><stop offset="1" stop-color="#090A14"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB454"/><stop offset="1" stop-color="#FF6B9A"/></linearGradient>
<radialGradient id="glow" cx="0.85" cy="0.1" r="0.7"><stop offset="0" stop-color="#FFB454" stop-opacity="0.22"/><stop offset="1" stop-color="#FFB454" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity="0.04"/></pattern>
<clipPath id="clip"><rect width="840" height="210" rx="18"/></clipPath>
</defs>

<g clip-path="url(#clip)">
  <rect width="840" height="210" fill="url(#bg)"/>
  <rect width="840" height="210" fill="url(#grid)"/>
  <rect width="840" height="210" fill="url(#glow)"/>
  <rect width="6" height="210" fill="url(#ac)"/>
</g>
<rect x="0.5" y="0.5" width="839" height="209" rx="18" fill="none" stroke="#fff" stroke-opacity="0.10"/>

<text class="m" x="36" y="42" font-size="11" letter-spacing="2" fill="#FFB454">CASE STUDY 03</text>
<g transform="translate(722,26)">
  <rect width="82" height="24" rx="12" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.18"/>
  <rect x="12" y="11" width="9" height="7" rx="1.5" fill="#9AA0B8"/>
  <path d="M14 11V9a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="#9AA0B8" stroke-width="1.4"/>
  <text class="m" x="27" y="16" font-size="10" letter-spacing="1.5" fill="#9AA0B8">PRIVATE</text>
</g>

<text class="s" x="36" y="84" font-size="25" font-weight="700" fill="#F4F5FB">Automated Data Reporting</text>
<text class="s" x="36" y="110" font-size="13" fill="#9AA0B8">Scheduled ETL reporting pipeline, triggered and</text>
<text class="s" x="36" y="128" font-size="13" fill="#9AA0B8">orchestrated entirely through CI/CD workflows.</text>

<g fill="#FFB454" fill-opacity="0.08" stroke="#FFB454" stroke-opacity="0.35">
  <rect x="36" y="156" width="90" height="26" rx="13"/>
  <rect x="134" y="156" width="69" height="26" rx="13"/>
  <rect x="211" y="156" width="117" height="26" rx="13"/>
</g>
<g class="m" font-size="11" fill="#D6DAE8" text-anchor="middle">
  <text x="81" y="173">TypeScript</text>
  <text x="168.5" y="173">Node.js</text>
  <text x="269.5" y="173">GitHub Actions</text>
</g>

<g transform="translate(480,28)">
  <g fill="#FFB454" fill-opacity="0.08" stroke="#FFB454" stroke-opacity="0.5">
    <rect x="0" y="46" width="92" height="46" rx="10"/>
    <rect x="112" y="46" width="92" height="46" rx="10"/>
    <rect x="224" y="46" width="92" height="46" rx="10"/>
  </g>
  <g class="m" font-size="10.5" letter-spacing="1" fill="#F4F5FB" text-anchor="middle">
    <text x="46" y="73">EXTRACT</text>
    <text x="158" y="73">TRANSFORM</text>
    <text x="270" y="73">LOAD</text>
  </g>
  <path d="M92 69 H112 M204 69 H224" stroke="#FFB454" stroke-opacity="0.6" stroke-width="1.5"/>

  <circle r="5" fill="#FF6B9A">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M0 69 H316"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <text class="m" x="0" y="22" font-size="10" fill="#9AA0B8">cron  →  report</text>
  <text class="m" x="0" y="122" font-size="10" fill="#9AA0B8">scheduled via GitHub Actions</text>
</g>
</svg>
