<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" role="img" aria-label="Real-Time Data Processing">
<style>
.m{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace}
.s{font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1020"/><stop offset="1" stop-color="#090A14"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3DDC97"/><stop offset="1" stop-color="#A3E635"/></linearGradient>
<radialGradient id="glow" cx="0.85" cy="0.1" r="0.7"><stop offset="0" stop-color="#3DDC97" stop-opacity="0.22"/><stop offset="1" stop-color="#3DDC97" stop-opacity="0"/></radialGradient>
<linearGradient id="wf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3DDC97" stop-opacity="0.30"/><stop offset="1" stop-color="#3DDC97" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity="0.04"/></pattern>
<clipPath id="clip"><rect width="840" height="210" rx="18"/></clipPath>
</defs>

<g clip-path="url(#clip)">
  <rect width="840" height="210" fill="url(#bg)"/>
  <rect width="840" height="210" fill="url(#grid)"/>
  <rect width="840" height="210" fill="url(#glow)"/>
  <rect width="6" height="210" fill="url(#ac)"/>
</g>
<rect x="0.5" y="0.5" width="839" height="209" rx="18" fill="none" stroke="#fff" stroke-opacity="0.10"/>

<text class="m" x="36" y="42" font-size="11" letter-spacing="2" fill="#3DDC97">CASE STUDY 02</text>
<g transform="translate(722,26)">
  <rect width="82" height="24" rx="12" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.18"/>
  <rect x="12" y="11" width="9" height="7" rx="1.5" fill="#9AA0B8"/>
  <path d="M14 11V9a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="#9AA0B8" stroke-width="1.4"/>
  <text class="m" x="27" y="16" font-size="10" letter-spacing="1.5" fill="#9AA0B8">PRIVATE</text>
</g>

<text class="s" x="36" y="84" font-size="25" font-weight="700" fill="#F4F5FB">Real-Time Data Processing</text>
<text class="s" x="36" y="110" font-size="13" fill="#9AA0B8">Asynchronous backend that aggregates and streams</text>
<text class="s" x="36" y="128" font-size="13" fill="#9AA0B8">metrics over WebSockets, with continuous integration.</text>

<g fill="#3DDC97" fill-opacity="0.08" stroke="#3DDC97" stroke-opacity="0.35">
  <rect x="36" y="156" width="62" height="26" rx="13"/>
  <rect x="106" y="156" width="90" height="26" rx="13"/>
  <rect x="204" y="156" width="56" height="26" rx="13"/>
  <rect x="268" y="156" width="56" height="26" rx="13"/>
</g>
<g class="m" font-size="11" fill="#D6DAE8" text-anchor="middle">
  <text x="67" y="173">Python</text>
  <text x="151" y="173">WebSockets</text>
  <text x="232" y="173">Redis</text>
  <text x="296" y="173">CI/CD</text>
</g>

<g transform="translate(480,28)">
  <g transform="translate(0,10)">
    <polygon points="0,92 28,88 52,96 80,60 108,72 136,40 164,58 192,30 220,50 248,34 276,44 300,26 300,112 0,112" fill="url(#wf)"/>
    <line x1="0" y1="112" x2="300" y2="112" stroke="#fff" stroke-opacity="0.12"/>
    <polyline points="0,92 28,88 52,96 80,60 108,72 136,40 164,58 192,30 220,50 248,34 276,44 300,26" fill="none" stroke="#3DDC97" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="520">
      <animate attributeName="stroke-dashoffset" values="520;0;0" keyTimes="0;0.7;1" dur="4s" repeatCount="indefinite"/>
    </polyline>
    <circle cx="300" cy="26" r="4" fill="#A3E635"/>
    <circle cx="300" cy="26" r="4" fill="none" stroke="#A3E635">
      <animate attributeName="r" values="4;16" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g class="m" font-size="10" fill="#9AA0B8">
    <text x="0" y="140">ingest</text>
    <text x="118" y="140">aggregate</text>
    <text x="262" y="140">stream</text>
  </g>
</g>
</svg>
